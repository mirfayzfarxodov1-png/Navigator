<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>World Navigator | Dunyo navigatori</title>
    
    <!-- Three.js va GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0f1e;
            --bg-darker: #05080f;
            --neon-blue: #00d4ff;
            --neon-cyan: #00ffff;
            --neon-purple: #9d00ff;
            --neon-pink: #ff00ff;
            --text-light: #ffffff;
            --text-dim: rgba(255,255,255,0.7);
        }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            min-height: 100vh;
        }

        /* 3D Yer canvasi */
        #earthCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Asosiy kontent */
        .main-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Kursor effektlari */
        .cursor-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-cyan);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            box-shadow: 0 0 5px var(--neon-cyan);
        }

        .cursor-outline {
            width: 35px;
            height: 35px;
            border: 2px solid var(--neon-pink);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: all 0.15s ease;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* Yuklash ekrani */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-darker);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0,212,255,0.2);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 20px;
            color: var(--neon-cyan);
            font-size: 1.1rem;
        }

        .loading-progress {
            width: 300px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            animation: loading 2s ease-out forwards;
        }

        /* Welcome matn */
        .welcome-text {
            text-align: center;
            margin-bottom: 50px;
            pointer-events: none;
        }

        .neon-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(0,212,255,0.5);
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        /* Dialog oynasi */
        .dialog-box {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(10,15,30,0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(0,212,255,0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            pointer-events: auto;
            animation: slideUp 0.5s ease-out;
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0,212,255,0.3);
        }

        .dialog-icon {
            font-size: 1.5rem;
        }

        .dialog-header h3 {
            font-size: 1.2rem;
            color: var(--neon-cyan);
        }

        .dialog-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dialog-close:hover {
            color: var(--neon-pink);
            transform: scale(1.1);
        }

        .dialog-body {
            padding: 20px;
        }

        .dialog-step p {
            margin-bottom: 15px;
            font-size: 1rem;
            color: var(--text-light);
        }

        .dialog-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .dialog-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0,212,255,0.3);
        }

        .dialog-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-blue));
            border: none;
            border-radius: 12px;
            color: var(--bg-dark);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dialog-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0,212,255,0.5);
        }

        .dialog-btn.success {
            background: linear-gradient(45deg, #00ff88, #00cc66);
            margin-bottom: 10px;
        }

        .dialog-btn.danger {
            background: linear-gradient(45deg, #ff3366, #cc0044);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 5px var(--neon-cyan);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-pink);
        }

        /* Animatsiyalar */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animasyon-pulse {
            animation: pulse 2s infinite;
        }

        .animasyon-fadeIn {
            animation: fadeIn 1s ease forwards;
        }

        .animasyon-float {
            animation: float 3s ease infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .neon-title { font-size: 2rem; }
            .subtitle { font-size: 0.8rem; }
            .dialog-box { width: 95%; bottom: 20px; }
            .dialog-header h3 { font-size: 1rem; }
            .dialog-input { padding: 10px 12px; font-size: 0.9rem; }
            .dialog-btn { padding: 10px; font-size: 0.9rem; }
        }

        @media (min-width: 1920px) {
            .neon-title { font-size: 5rem; }
            .subtitle { font-size: 1.3rem; }
            .dialog-box { max-width: 600px; }
        }
    </style>
</head>
<body>

    <!-- 3D Yer sayyorasi canvasi -->
    <canvas id="earthCanvas"></canvas>
    
    <!-- Kursor effektlari -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    
    <!-- Yuklash ekrani -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">World Navigator yuklanmoqda...</div>
        <div class="loading-progress">
            <div class="loading-bar"></div>
        </div>
    </div>
    
    <!-- Asosiy kontent -->
    <div id="mainContent" class="main-content" style="display: none;">
        <div class="welcome-text">
            <h1 class="neon-title animasyon-pulse">🌍 WORLD NAVIGATOR 🌍</h1>
            <p class="subtitle animasyon-fadeIn">Dunyoning eng kuchli 3D navigator tizimi</p>
        </div>
        
        <!-- Navigator dialog oynasi -->
        <div id="dialogBox" class="dialog-box">
            <div class="dialog-header">
                <span class="dialog-icon">🗺️</span>
                <h3>Navigator</h3>
                <button id="dialogClose" class="dialog-close">✖</button>
            </div>
            <div class="dialog-body">
                <p id="dialogMessage">👋 Salom! Dunyo navigatoriga xush kelibsiz!</p>
                <div id="dialogStep1">
                    <p>🔍 Qayerga bormoqchisiz?</p>
                    <input type="text" id="placeInput" class="dialog-input" placeholder="Davlat, shahar, ko‘cha, uy nomi...">
                    <button id="submitBtn" class="dialog-btn">Yuborish</button>
                </div>
                <div id="dialogStep2" style="display: none;">
                    <p id="placeResult"></p>
                    <button id="addPlaceBtn" class="dialog-btn success">✅ Ha, qo‘shaman</button>
                    <button id="cancelBtn" class="dialog-btn danger">❌ Yo‘q, keyinroq</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 3D YER SAYYORASI (Three.js) ==========
        let scene, camera, renderer, earth, stars;
        let mouseX = 0, mouseY = 0;
        
        function initEarth() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05080f);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;
            
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('earthCanvas') });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // Yorug'lik
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 3, 5);
            scene.add(mainLight);
            
            // Yer yaratish
            const geometry = new THREE.SphereGeometry(1, 128, 128);
            // Rangli material (tekstura o‘rniga)
            const material = new THREE.MeshStandardMaterial({
                color: 0x2a6f8f,
                roughness: 0.5,
                metalness: 0.1,
                emissive: 0x0a2a3f,
                emissiveIntensity: 0.3
            });
            earth = new THREE.Mesh(geometry, material);
            scene.add(earth);
            
            // Yulduzlar yaratish
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 3000;
            const starsPositions = new Float32Array(starsCount * 3);
            for (let i = 0; i < starsCount * 3; i += 3) {
                starsPositions[i] = (Math.random() - 0.5) * 200;
                starsPositions[i+1] = (Math.random() - 0.5) * 100;
                starsPositions[i+2] = (Math.random() - 0.5) * 100 - 50;
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 });
            stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
            
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Yerning aylanishi
            earth.rotation.y += 0.002;
            earth.rotation.x += 0.0005;
            
            // Yulduzlarning aylanishi
            stars.rotation.y += 0.0002;
            stars.rotation.x += 0.0001;
            
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ========== KURSOR EFFEKTLARI ==========
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        
        document.addEventListener('mousemove', (e) => {
            cursorDot.style.transform = `translate(${e.clientX - 3}px, ${e.clientY - 3}px)`;
            cursorOutline.style.transform = `translate(${e.clientX - 17}px, ${e.clientY - 17}px)`;
        });
        
        // Tugmalar ustiga kelganda kursor effekti
        document.querySelectorAll('button, .dialog-btn, .dialog-close').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursorOutline.style.transform = `scale(1.5)`;
                cursorOutline.style.borderColor = '#00ffff';
            });
            el.addEventListener('mouseleave', () => {
                cursorOutline.style.transform = `scale(1)`;
                cursorOutline.style.borderColor = '#ff00ff';
            });
        });
        
        // ========== DIALOG FUNKSIYALARI ==========
        let userLocation = null;
        
        function getBrowserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        console.log('Lokatsiya aniqlandi:', userLocation);
                    },
                    (error) => {
                        console.log('Lokatsiya aniqalanmadi:', error.message);
                        userLocation = { lat: 41.3111, lng: 69.2797 }; // Toshkent default
                    }
                );
            } else {
                userLocation = { lat: 41.3111, lng: 69.2797 };
            }
        }
        
        // Sahifa yuklanganda
        window.addEventListener('load', () => {
            initEarth();
            getBrowserLocation();
            
            // Yuklash ekranini yashirish
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'flex';
                }, 500);
            }, 2000);
        });
        
        // Dialog funksiyalari
        const submitBtn = document.getElementById('submitBtn');
        const placeInput = document.getElementById('placeInput');
        const dialogStep1 = document.getElementById('dialogStep1');
        const dialogStep2 = document.getElementById('dialogStep2');
        const placeResult = document.getElementById('placeResult');
        const dialogMessage = document.getElementById('dialogMessage');
        
        submitBtn.addEventListener('click', () => {
            const place = placeInput.value.trim();
            if (place.length < 3) {
                dialogMessage.textContent = '⚠️ Iltimos, kamida 3 harf yozing!';
                dialogMessage.style.color = '#ff3366';
                setTimeout(() => {
                    dialogMessage.textContent = '👋 Salom! Dunyo navigatoriga xush kelibsiz!';
                    dialogMessage.style.color = '#ffffff';
                }, 2000);
                return;
            }
            
            // Joyni tekshirish
            dialogStep1.style.display = 'none';
            dialogStep2.style.display = 'block';
            placeResult.textContent = `📍 Siz "${place}" joyini qidirdingiz. Bu joy hali maʼlumotlar bazasiga qoʻshilmagan.`;
            dialogMessage.textContent = '❓ Hali hech nima qo‘shilmagan!';
        });
        
        document.getElementById('addPlaceBtn').addEventListener('click', () => {
            dialogMessage.textContent = '✅ Joy qo‘shish formasi ochiladi (2-qadamda)';
            dialogMessage.style.color = '#00ff88';
        });
        
        document.getElementById('cancelBtn').addEventListener('click', () => {
            dialogStep2.style.display = 'none';
            dialogStep1.style.display = 'block';
            placeInput.value = '';
            dialogMessage.textContent = '👋 Salom! Dunyo navigatoriga xush kelibsiz!';
            dialogMessage.style.color = '#ffffff';
        });
        
        document.getElementById('dialogClose').addEventListener('click', () => {
            document.getElementById('dialogBox').style.display = 'none';
        });
        
        // Enter tugmasi
        placeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });
    </script>
</body>
</html>
